# Local development stack: the app plus a disposable Postgres instance.
#
#   docker compose up --build
#   docker compose exec app npm run migration:reset   # first run only
#
# Uses .env.dev for everything except DATABASE_URL, which is overridden below
# to point at the "db" service by its Compose network hostname — "localhost"
# in .env.dev would resolve to the app container itself, not the database
# container, since each container has its own network namespace.

services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - '3000:3000'
      - '3001:3001'
    env_file:
      - .env.dev
    environment:
      DATABASE_URL: postgres://gitmart:gitmart@db:5432/gitmart
      WS_PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    # The named schema.sql lives in the image already; migrate.js from
    # scripts/ can be run ad hoc with `docker compose exec app npm run migrate`.
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: gitmart
      POSTGRES_PASSWORD: gitmart
      POSTGRES_DB: gitmart
    ports:
      - '5432:5432'
    volumes:
      - gitmart_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gitmart']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gitmart_db_data:
