name: Publish QA Report

on:
  push:
    branches:
      - main
    paths:
      - "reports/**"
      - ".github/workflows/qa-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Make QA report the homepage
        shell: bash
        run: cp reports/qa-report.html reports/index.html

      - name: Upload reports
        uses: actions/upload-pages-artifact@v4
        with:
          path: reports

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4