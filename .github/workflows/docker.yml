name: Docker

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Same reasoning as ci.yml's concurrency block: without it, every push to a
# branch with an open PR leaves the previous push's build still running
# instead of cancelling it.
concurrency:
  group: docker-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Builds the production image on every push and PR, not just at release
  # time — a broken Dockerfile should fail the same PR that broke it, not the
  # next tag pushed weeks later. Never pushed anywhere from here; cd.yml's
  # build job does that against a tagged commit. Split into its own workflow
  # rather than a job inside ci.yml because it has nothing in common with the
  # lint/test/report chain there — it doesn't need lint or tests to pass
  # first, and nothing downstream needs it to finish either.
  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
