name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A push to a branch with an open PR fires both a `push` and a `pull_request`
# run for the same commit, and every further push starts another pair without
# cancelling the last — see the four runs still "in_progress" an hour later
# on 2026-08-04 after a hung Tests job. Scoping the group to ref+event keeps
# the two intentional parallel runs but cancels a run superseded by a newer
# push to the same branch.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ── Lint & Format ──────────────────────────────────────────────────────
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Prettier was never enforced, so formatting drifted whenever someone's
      # editor used different settings — see a4e6eca, which reindented two
      # blocks and passed CI regardless.
      - name: Format check
        run: npm run format:check

  # ── Tests ────────────────────────────────────────────────────────────────
  # Split from Lint & Format so the two show as distinct stages in the
  # Actions graph, and a lint failure is visible without waiting on the full
  # suite (unit + integration + E2E) to also finish.
  tests:
    name: Tests
    needs: lint-and-format
    runs-on: ubuntu-latest
    # Without this, a genuine hang (rather than a per-test Jest timeout) runs
    # up to the platform default of 360 minutes before anyone notices — see
    # the four runs still "in_progress" an hour later on 2026-08-04.
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cicd-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create test environment file
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/cicd-test" > .env.test
          echo "PORT=3001" >> .env.test
          echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY || 'ci-test-access-secret' }}" >> .env.test
          echo "JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET || 'ci-test-refresh-secret' }}" >> .env.test
          echo "BCRYPT_PEPPER=${{ secrets.BCRYPT_PEPPER || 'ci-test-pepper' }}" >> .env.test

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      # E2E was previously absent from CI, so browser-level regressions — a CSS
      # rule hiding the wrong element, a broken redirect — reached main unseen.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Verifies the additive migrations apply cleanly on top of the schema, so
      # a migration that only works on the author's machine cannot reach a
      # release. Run last because it mutates the CI database.
      - name: Migrations apply cleanly
        run: npx dotenv -e .env.test -- node scripts/migrate.js

  # ── Reports ─────────────────────────────────────────────────────────────
  # Regenerates the full QA report via scripts/qa-report.js — protected by
  # GitHub Classroom per the CA4 instructions, run here exactly as-is and
  # never edited — and packages its output for GitHub Pages. This reruns
  # lint/format/unit/integration/E2E a second time internally, because that
  # script is a self-contained pipeline in its own right; there is no way to
  # call into it partially. Depends on Tests passing first so a report is
  # never published for a commit that is already known broken, but the run
  # here is what actually produces the artifact.
  reports:
    name: Reports
    needs: tests
    runs-on: ubuntu-latest
    # qa-report.js reruns the full suite internally; continue-on-error on the
    # report step only protects against it failing, not against it hanging.
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cicd-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create test environment file
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/cicd-test" > .env.test
          echo "PORT=3001" >> .env.test
          echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY || 'ci-test-access-secret' }}" >> .env.test
          echo "JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET || 'ci-test-refresh-secret' }}" >> .env.test
          echo "BCRYPT_PEPPER=${{ secrets.BCRYPT_PEPPER || 'ci-test-pepper' }}" >> .env.test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # continue-on-error because the script itself exits 1 whenever any step
      # it ran failed (see the bottom of scripts/qa-report.js). A red report
      # is more useful published than not published at all, so a failing run
      # here must not stop this job before the upload steps below.
      - name: Run full QA report
        continue-on-error: true
        run: npm run report

      # Deliberately not a heredoc: a heredoc's closing delimiter must be
      # completely unindented, which is easy to get wrong once it is nested
      # inside a YAML block scalar. A grouped block of echo lines has no
      # equivalent footgun.
      - name: Assemble the Pages site
        run: |
          mkdir -p pages-dist
          cp reports/qa-report.html pages-dist/qa-report.html 2>/dev/null || true
          cp reports/eslint-report.html pages-dist/eslint-report.html 2>/dev/null || true
          [ -d coverage-report ] && cp -r coverage-report pages-dist/coverage-report
          [ -d playwright-report ] && cp -r playwright-report pages-dist/playwright-report
          {
            echo '<!doctype html>'
            echo '<html lang="en">'
            echo '<head>'
            echo '<meta charset="utf-8" />'
            echo '<title>GitMart QA Dashboard</title>'
            echo '<style>'
            echo 'body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:640px;margin:4rem auto;padding:0 1.5rem;color:#1e1e2e}'
            echo 'h1{font-size:1.4rem}ul{line-height:2.2}.meta{color:#666;font-size:.85rem}'
            echo '</style>'
            echo '</head>'
            echo '<body>'
            echo '<h1>GitMart QA Dashboard</h1>'
            echo "<p class=\"meta\">Generated from commit <code>${{ github.sha }}</code>.</p>"
            echo '<ul>'
            echo '<li><a href="qa-report.html">Full QA report</a> — lint, format, unit, integration, E2E, summary</li>'
            echo '<li><a href="eslint-report.html">ESLint detail report</a></li>'
            echo '<li><a href="coverage-report/index.html">Coverage report</a> — statement/branch/function/line coverage</li>'
            echo '<li><a href="playwright-report/index.html">Playwright E2E report</a></li>'
            echo '</ul>'
            echo '</body>'
            echo '</html>'
          } > pages-dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  # ── GitHub Pages ────────────────────────────────────────────────────────
  # Reports runs on every branch and PR so its output is visible locally as
  # a downloadable artifact, but only a push to main actually publishes to
  # the public dashboard — a feature branch mid-work must never overwrite it.
  github-pages:
    name: GitHub Pages
    needs: reports
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
