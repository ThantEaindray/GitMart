name: Security Scan

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read

jobs:
  njsscan:
    name: njsscan (javascript)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run njsscan
        uses: ajinabraham/njsscan-action@master
        with:
          args: 'src/'

  dependency-audit:
    name: npm audit (high and critical)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check dependency vulnerabilities
        run: npm audit --audit-level=high
