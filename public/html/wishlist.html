<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitMart — Wishlist</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Jost:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../css/noir.css" />
    <link rel="stylesheet" href="../css/notifications.css" />
    <link rel="stylesheet" href="../css/listings.css" />
    <script>
      var t = localStorage.getItem('theme');
      var f = localStorage.getItem('font');
      var m = localStorage.getItem('motion');
      if (t) document.documentElement.setAttribute('data-theme', t);
      if (f) document.documentElement.setAttribute('data-font', f);
      if (m === 'reduced') document.documentElement.setAttribute('data-motion', 'reduced');
    </script>
  </head>

  <body>
    <nav class="nav">
      <div class="logo">GitMart</div>

      <button
        class="nav-hamburger"
        type="button"
        aria-label="Toggle navigation"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="nav-collapse" id="nav-menu">
        <ul class="nav-links">
          <li><a href="noir.html">Home</a></li>
          <li><a href="products.html">Products</a></li>
          <li><a href="listings.html">Listings</a></li>
          <li><a href="listing-create.html">Create Listing</a></li>
        </ul>
      </div>

      <div class="nav-right">
        <a class="icon-btn" id="btn-account" href="login.html" title="Login"
          ><i class="bi bi-person"></i
        ></a>
        <a class="icon-btn active" href="wishlist.html" title="Wishlist">
          <i class="bi bi-heart-fill" style="color: var(--accent)"></i>
        </a>
        <a class="icon-btn" href="checkout.html" title="Cart"><i class="bi bi-bag"></i></a>
        <a class="icon-btn" href="chats.html" title="Chats"><i class="bi bi-chat-left-dots"></i></a>
        <a class="icon-btn" href="settings.html" title="Settings"><i class="bi bi-gear"></i></a>
      </div>
    </nav>

    <section class="section">
      <div class="section-header">
        <div>
          <div class="hero-tag">Saved</div>
          <h2 class="section-title">My Wishlist</h2>
        </div>
        <a href="listings.html" class="see-all">Browse Listings →</a>
      </div>

      <div id="wishlistGrid" class="products">
        <p class="status-text">Loading wishlist…</p>
      </div>
    </section>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
    <script src="../js/gsap-animations.js"></script>
    <script src="../js/prefs.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/wishlist.js"></script>
    <script src="../js/notif-badge.js"></script>
  </body>
</html>
