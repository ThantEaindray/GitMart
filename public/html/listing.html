<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitMart — Listing</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Jost:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../css/noir.css" />
    <link rel="stylesheet" href="../css/notifications.css" />
    <link rel="stylesheet" href="../css/listings.css" />
    <style>
      #reviews-section {
        padding: 48px 60px 60px;
      }
      .rv-form {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        max-width: 560px;
        margin-bottom: 2rem;
      }
      .rv-star-picker {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 1.4rem;
      }
      .rv-picker-label {
        font-size: 0.85rem;
        color: var(--muted);
        margin-right: 0.25rem;
      }
      .rv-star {
        cursor: pointer;
        color: var(--accent, #c9a96e);
        user-select: none;
        transition: transform 0.1s;
      }
      .rv-star:hover {
        transform: scale(1.2);
      }
      .rv-textarea {
        width: 100%;
        padding: 0.6rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface, var(--bg));
        color: var(--text);
        font-family: inherit;
        font-size: 0.9rem;
        resize: vertical;
      }
      .rv-submit {
        align-self: flex-start;
      }
      .rv-card {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1rem 1.25rem;
        margin-bottom: 1rem;
        max-width: 680px;
      }
      .rv-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-bottom: 0.4rem;
      }
      .rv-stars--display {
        color: var(--accent, #c9a96e);
        font-size: 1.1rem;
        letter-spacing: 0.05em;
      }
      .rv-author {
        font-weight: 600;
        font-size: 0.9rem;
      }
      .rv-date {
        font-size: 0.8rem;
        color: var(--muted);
        margin-left: auto;
      }
      .rv-comment {
        margin: 0;
        font-size: 0.9rem;
        color: var(--text);
        line-height: 1.5;
      }
      .rv-delete {
        margin-left: 0.5rem;
        background: none;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0.15rem 0.5rem;
        font-size: 0.75rem;
        color: var(--muted);
        cursor: pointer;
      }
      .rv-delete:hover {
        color: #c0392b;
        border-color: #c0392b;
      }
      .rv-empty {
        color: var(--muted);
        font-style: italic;
      }
      .product-rating {
        color: var(--accent, #c9a96e);
        font-size: 1rem;
        margin-bottom: 0.5rem;
      }
      .product-rating .rv-count {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .product-seller-bar {
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 1rem;
      }
      .seller-name-link {
        color: var(--accent, #c9a96e);
        text-decoration: none;
        font-weight: 600;
      }
      .seller-name-link:hover {
        text-decoration: underline;
      }
    </style>
    <script>
      var t = localStorage.getItem('theme');
      var f = localStorage.getItem('font');
      var m = localStorage.getItem('motion');
      if (t) document.documentElement.setAttribute('data-theme', t);
      if (f) document.documentElement.setAttribute('data-font', f);
      if (m === 'reduced') document.documentElement.setAttribute('data-motion', 'reduced');
    </script>
  </head>
  <body>
    <nav class="nav">
      <div class="logo">GitMart</div>

      <button
        class="nav-hamburger"
        type="button"
        aria-label="Toggle navigation"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="nav-collapse" id="nav-menu">
        <ul class="nav-links">
          <li><a href="noir.html">Home</a></li>
          <li><a href="products.html">Products</a></li>
          <li><a href="listings.html">Listings</a></li>
          <li><a href="listing-create.html">Create Listing</a></li>
          <li><a href="my-sales.html">My Sales</a></li>
        </ul>
      </div>

      <div class="nav-right">
        <a class="icon-btn" id="btn-account" href="login.html" title="Login"
          ><i class="bi bi-person"></i
        ></a>
        <button class="icon-btn" id="btn-wishlist" title="Wishlist">
          <i class="bi bi-heart"></i>
        </button>
        <a class="icon-btn" href="checkout.html" title="Cart"><i class="bi bi-bag"></i></a>
        <a class="icon-btn" href="chats.html" title="Chats"><i class="bi bi-chat-left-dots"></i></a>
        <a class="icon-btn" href="settings.html" title="Settings"><i class="bi bi-gear"></i></a>
      </div>
    </nav>

    <div class="breadcrumb-bar">
      <a href="listings.html" class="breadcrumb-back">
        <i class="bi bi-arrow-left"></i> Back to Listings
      </a>
    </div>

    <section class="product-detail" id="listing-detail">
      <p class="status-text">Loading…</p>
    </section>

    <div id="related-section" style="display: none; border-top: 1px solid var(--border)">
      <div style="padding: 48px 60px 60px">
        <div class="section-header">
          <div>
            <div class="hero-tag">Browse More</div>
            <h2 class="section-title">More in this Category</h2>
          </div>
          <a id="related-see-all" href="listings.html" class="see-all">See all listings →</a>
        </div>
        <div class="products" id="related-grid"></div>
      </div>
    </div>

    <div id="reviews-section" style="border-top: 1px solid var(--border)">
      <div class="section-header" style="margin-bottom: 1.5rem">
        <div>
          <div class="hero-tag">Community</div>
          <h2 class="section-title">Reviews</h2>
        </div>
      </div>
      <div id="review-form-container"></div>
      <div id="reviews-list"><p class="status-text">Loading reviews…</p></div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
    <script src="../js/gsap-animations.js"></script>
    <script src="../js/queryCmds.js"></script>
    <script src="../js/prefs.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/listing.js"></script>
    <script src="../js/reviews.js"></script>
    <script src="../js/notif-badge.js"></script>
  </body>
</html>
