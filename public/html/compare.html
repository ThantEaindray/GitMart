<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compare Listings — GitMart</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Jost:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../css/noir.css" />
    <link rel="stylesheet" href="../css/compare.css" />
    <link rel="stylesheet" href="../css/notifications.css" />
    <script>
      var t = localStorage.getItem('theme');
      var f = localStorage.getItem('font');
      var m = localStorage.getItem('motion');
      if (t) document.documentElement.setAttribute('data-theme', t);
      if (f) document.documentElement.setAttribute('data-font', f);
      if (m === 'reduced') document.documentElement.setAttribute('data-motion', 'reduced');
    </script>
  </head>
  <body>
    <nav class="nav">
      <div class="logo">GitMart</div>
      <button
        class="nav-hamburger"
        type="button"
        aria-label="Toggle navigation"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="nav-collapse" id="nav-menu">
        <ul class="nav-links">
          <li><a href="noir.html">Home</a></li>
          <li><a href="products.html">Products</a></li>
          <li><a href="listings.html">Listings</a></li>
          <li><a href="listing-create.html">Create Listing</a></li>
        </ul>
      </div>
      <div class="nav-right">
        <a class="icon-btn" id="btn-account" href="login.html" title="Login"
          ><i class="bi bi-person"></i
        ></a>
        <button class="icon-btn" id="btn-wishlist" title="Wishlist">
          <i class="bi bi-heart"></i>
        </button>
        <a class="icon-btn" href="checkout.html" title="Cart"><i class="bi bi-bag"></i></a>
        <a class="icon-btn" href="chats.html" title="Chats"><i class="bi bi-chat-left-dots"></i></a>
        <a class="icon-btn" href="settings.html" title="Settings"><i class="bi bi-gear"></i></a>
      </div>
    </nav>

    <main class="compare-page">
      <header class="compare-header">
        <div>
          <p class="compare-kicker">Side-by-side</p>
          <h1 class="compare-heading">Compare Listings</h1>
          <p class="compare-sub">
            Evaluate price, category, description, and ratings across selected listings.
          </p>
        </div>
        <div class="compare-header-actions">
          <a class="btn-outline" href="listings.html" style="text-decoration: none">
            <i class="bi bi-arrow-left" style="margin-right: 6px"></i>Back to Listings
          </a>
          <button class="btn-outline" id="compare-clear-all" type="button">Clear All</button>
        </div>
      </header>

      <div id="compare-content"></div>
    </main>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
    <script src="../js/gsap-animations.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/compare.js"></script>
    <script src="../js/notif-badge.js"></script>
  </body>
</html>
