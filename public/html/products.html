<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitMart — Browse</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Jost:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../css/noir.css" />
    <script>
      var t = localStorage.getItem('theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    </script>
  </head>
  <body>
    <!-- ── NAVIGATION ── -->
    <nav class="nav">
      <div class="logo">GitMart</div>

      <ul class="nav-links">
        <li><a href="noir.html">Home</a></li>
        <li><a href="products.html">New In</a></li>
        <li><a href="products.html">Collections</a></li>
        <li><a href="#">Brands</a></li>
        <li><a href="#">About</a></li>
      </ul>

      <div class="nav-right">
        <button class="icon-btn" id="btn-search" title="Search">
          <i class="bi bi-search"></i>
        </button>
        <a class="icon-btn" id="btn-account" href="login.html" title="Login"><i class="bi bi-person"></i></a>
        <button class="icon-btn" id="btn-wishlist" title="Wishlist">
          <i class="bi bi-heart"></i>
        </button>
        <button class="icon-btn" id="btn-cart" title="Cart"><i class="bi bi-bag"></i></button>
        <a class="icon-btn" href="settings.html" title="Appearance"><i class="bi bi-palette"></i></a>
      </div>
    </nav>

    <!-- ── SEARCH BAR ── -->
    <div class="search-bar" id="search-bar">
      <div class="search-inner">
        <i class="bi bi-search search-icon-sm"></i>
        <input type="text" id="search-input" placeholder="Search pieces…" autocomplete="off" />
        <button class="icon-btn" id="btn-search-clear" title="Clear">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </div>

    <!-- ── BREADCRUMB ── -->
    <div class="breadcrumb-bar">
      <a href="noir.html" class="breadcrumb-back">
        <i class="bi bi-arrow-left"></i> Back to Home
      </a>
    </div>

    <!-- ── PRODUCTS ── -->
    <section class="section" id="products-section">
      <div class="section-header">
        <h2 class="section-title" id="section-title">All Products</h2>
      </div>

      <div class="category-pills" id="category-pills">
        <button class="pill active" data-category="">All</button>
        <button class="pill" data-category="Timepieces">Timepieces</button>
        <button class="pill" data-category="Accessories">Accessories</button>
        <button class="pill" data-category="Jewellery">Jewellery</button>
        <button class="pill" data-category="Writing">Writing</button>
        <button class="pill" data-category="Footwear">Footwear</button>
        <button class="pill" data-category="Apparel">Apparel</button>
      </div>

      <div class="products" id="products-grid">
        <p class="status-text">Loading products…</p>
      </div>
    </section>

    <script src="../js/api.js"></script>
    <script src="../js/products.js"></script>
  </body>
</html>
