<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitMart — Profile</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Jost:wght@300;400;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../css/noir.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>

<body>
  <!-- ── NAVIGATION ── -->
  <nav class="nav">
    <div class="logo">GitMart</div>

    <ul class="nav-links">
      <li><a href="noir.html">New In</a></li>
      <li><a href="noir.html">Collections</a></li>
      <li><a href="noir.html">Brands</a></li>
      <li><a href="noir.html">About</a></li>
    </ul>

    <div class="nav-right">
      <a class="icon-btn" href="profile.html" title="Profile">
        <i class="bi bi-person-circle"></i>
      </a>
      <button class="icon-btn" id="btn-wishlist" title="Wishlist">
        <i class="bi bi-heart"></i>
      </button>
      <button class="icon-btn" id="btn-cart" title="Cart">
        <i class="bi bi-bag"></i>
      </button>
    </div>
  </nav>

  <!-- ── BREADCRUMB ── -->
  <div class="breadcrumb-bar">
    <a href="noir.html" class="breadcrumb-back">
      <i class="bi bi-arrow-left"></i> Back to Store
    </a>
  </div>

  <!-- ── PROFILE SECTION ── -->
  <section class="product-detail">
    <div class="hero-content">
      <div class="hero-tag">Account Profile</div>
      <h1>My GitMart Profile</h1>
      <p>
        View your account details and manage your current login session.
      </p>

      <div id="warningCard" class="status-text d-none">
        <span id="warningText"></span>
      </div>

      <div class="status-text">
        <p><strong>Username:</strong> <span id="profileUsername">Loading...</span></p>
        <p><strong>Email:</strong> <span id="profileEmail">Loading...</span></p>
        <p><strong>Role:</strong> <span id="profileStaff">Loading...</span></p>
        <p><strong>Created On:</strong> <span id="profileCreatedOn">Loading...</span></p>
      </div>

      <button id="logoutBtn" class="btn-outline">Logout</button>
    </div>
  </section>

  <script src="../js/profile.js"></script>
  <script src="../js/logout.js"></script>
</body>

</html>
