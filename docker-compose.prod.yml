# Deploy-time stack for the EC2 host. Pulls a pre-built image from GHCR
# rather than building — the image was already built and tested in CI, so
# rebuilding here would mean running untested code.
#
# No database service here: production Postgres stays external (its own
# managed instance), so the app container is stateless and disposable —
# replacing it on every deploy loses nothing. Containerising a stateful
# database on a single EC2 instance would need its own volume and backup
# story, which was not asked for and is a materially bigger decision.
#
# GHCR_IMAGE and IMAGE_TAG are set by the deploy script before this file runs
# — see the "deploy" job in .github/workflows/cd.yml. GHCR_IMAGE is
# derived from github.repository the same way the build job derives the name
# it pushes to, so the two can never name two different packages again.

services:
  app:
    image: ${GHCR_IMAGE}:${IMAGE_TAG}
    ports:
      - '3000:3000'
      - '3001:3001'
    env_file:
      - .env
    environment:
      WS_PORT: 3001
    restart: unless-stopped
    # Postgres on this host runs natively (not containerised), reachable from
    # inside the app container as host.docker.internal rather than localhost
    # — a container's own localhost never refers to the host machine.
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # Reverse proxy for the domain. Terminates TLS with a free, auto-renewing
  # Let's Encrypt cert — Caddy handles the whole ACME flow itself, no certbot
  # or manual renewal cron needed. Talks to `app` over the compose network by
  # service name, same as `host.docker.internal` does for Postgres above.
  #
  # The app's own ports stay published too (see above), so the existing
  # http://<ec2-ip>:3000 path keeps working unchanged alongside this.
  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - app

volumes:
  # Named volumes rather than bind mounts so the issued certificate survives
  # `docker compose up -d` recreating the container on every deploy — without
  # this, every deploy would re-request a cert and risk Let's Encrypt's rate
  # limit.
  caddy_data:
  caddy_config:
